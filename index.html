<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Repository</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="logo"><i></i> IMAGE REPO</div><span>UPLOAD CENTER</span></header>
<main>
<section class="panel">
<p class="eyebrow">REPOSITORY / 01</p>
<h1>Upload an image</h1>
<p class="intro">Upload an image and add its information to your repository.</p>
<form id="form">
<div class="layout">
<div>
<label>Image file</label>
<input id="file" type="file" accept="image/*" hidden required>
<label for="file" class="drop" id="drop">
<div id="placeholder"><strong>↑</strong><h2>Choose image</h2><p>Click to browse or drag and drop</p><small>JPG · PNG · WEBP</small></div>
<img id="preview" alt="Preview">
</label>
<p id="chosen"></p>
</div>
<div>
<label for="filename">Filename</label><input id="filename" placeholder="image-name">
<label for="title">Title *</label><input id="title" required placeholder="Image title">
<label for="category">Category *</label><select id="category" required><option value="">Select category</option><option>Nature</option><option>People</option><option>Animals</option><option>Architecture</option><option>Illustration</option><option>Digital Art</option><option>Other</option></select>
<label for="price">Price metadata</label><input id="price" type="number" min="0" step=".01" placeholder="0.00">
<label for="description">Description *</label><textarea id="description" required rows="5" placeholder="Describe your image..."></textarea>
<p id="message"></p><button>↑ Upload to repository</button>
</div>
</div>
</form>
</section>
<section><p class="eyebrow">REPOSITORY / 02</p><h2>Your images</h2><div class="toolbar"><input id="search" placeholder="Search images..."><select id="filter"><option>All</option><option>Nature</option><option>People</option><option>Animals</option><option>Architecture</option><option>Illustration</option><option>Digital Art</option><option>Other</option></select></div><div id="gallery" class="gallery"></div></section>
</main>
<footer>IMAGE REPOSITORY · UPLOAD AND ORGANIZE</footer>
<script src="script.js"></script>
</body>
</html>
