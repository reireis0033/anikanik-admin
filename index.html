<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Repository Uploader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <div class="eyebrow">ADMIN UPLOADER</div>
    <h1>Add Image</h1>
    <p class="muted">Upload, rename, and save an image to your repository.</p>

    <form id="uploadForm">
      <label class="dropzone" id="dropzone">
        <input id="image" name="image" type="file" accept="image/*" required>
        <div id="dropText">📷 Choose an image</div>
        <img id="preview" alt="Preview">
      </label>

      <div class="rename-box">
        <div class="row-between">
          <label>Filename</label>
          <span id="nextName" class="pill">Automatic</span>
        </div>
        <div class="radio-row">
          <label><input type="radio" name="renameMode" value="automatic" checked> Automatic</label>
          <label><input type="radio" name="renameMode" value="custom"> Custom</label>
        </div>
        <input id="customName" name="customName" placeholder="e.g. persian-cat" disabled>
        <small>Automatic names use 000001.webp, 000002.webp, etc.</small>
      </div>

      <label>Title
        <input name="title" placeholder="Enter image title" required>
      </label>

      <label>Price
        <input name="price" type="number" min="0" step="0.01" placeholder="150" required>
      </label>

      <label>Description
        <textarea name="description" rows="4" placeholder="Describe the image"></textarea>
      </label>

      <label>Category
        <select name="category" required>
          <option value="" selected disabled>Select a category</option>
          <option value="Animals">Animals</option>
          <option value="Nature">Nature</option>
          <option value="People">People</option>
          <option value="Technology">Technology</option>
          <option value="Travel">Travel</option>
          <option value="Food">Food</option>
          <option value="Architecture">Architecture</option>
          <option value="Abstract">Abstract</option>
          <option value="Other">Other</option>
        </select>
      </label>

      <fieldset class="tags-field">
        <legend>Tags</legend>
        <div class="checklist">
          <label><input type="checkbox" name="tags" value="featured"> Featured</label>
          <label><input type="checkbox" name="tags" value="popular"> Popular</label>
          <label><input type="checkbox" name="tags" value="new"> New</label>
          <label><input type="checkbox" name="tags" value="free"> Free</label>
          <label><input type="checkbox" name="tags" value="premium"> Premium</label>
          <label><input type="checkbox" name="tags" value="high-resolution"> High resolution</label>
        </div>
      </fieldset>

      <button id="submitBtn" type="submit">UPLOAD IMAGE</button>
      <div id="status" class="status"></div>
    </form>


  </main>
  <script src="script.js"></script>
</body>
</html>
