
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Repository</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <span class="logo-dot"></span>
      IMAGE REPO
    </div>
    <div class="header-label">IMAGE UPLOAD SYSTEM</div>
  </header>

  <main class="container">

    <section class="upload-section">

      <div class="section-heading">
        <span class="eyebrow">REPOSITORY / 01</span>
        <h1>Upload an image</h1>
        <p>Add an image and provide its information.</p>
      </div>

      <form id="uploadForm">

        <div class="upload-layout">

          <!-- Image upload -->
          <div class="upload-column">
            <label class="field-label">Image file</label>

            <input
              type="file"
              id="imageFile"
              accept="image/*"
              hidden
              required
            >

            <label for="imageFile" class="drop-zone" id="dropZone">
              <div id="uploadPlaceholder">
                <div class="upload-icon">↑</div>
                <h2>Upload image</h2>
                <p>Click to browse or drag and drop</p>
                <span>JPG · PNG · WEBP</span>
              </div>

              <img id="imagePreview" alt="Image preview">
            </label>

            <p id="fileName" class="file-name"></p>

            <button
              type="button"
              class="secondary-button"
              id="removeImage"
              hidden
            >
              Remove image
            </button>
          </div>

          <!-- Image information -->
          <div class="details-column">

            <div class="form-group">
              <label for="imageName">Filename</label>
              <input
                type="text"
                id="imageName"
                placeholder="image-name"
              >
            </div>

            <div class="form-group">
              <label for="imageTitle">Title *</label>
              <input
                type="text"
                id="imageTitle"
                placeholder="Enter image title"
                required
              >
            </div>

            <div class="form-group">
              <label for="imageCategory">Category *</label>
              <select id="imageCategory" required>
                <option value="">Select category</option>
                <option value="Nature">Nature</option>
                <option value="People">People</option>
                <option value="Animals">Animals</option>
                <option value="Architecture">Architecture</option>
                <option value="Illustration">Illustration</option>
                <option value="Digital Art">Digital Art</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="imagePrice">Price metadata</label>
              <input
                type="number"
                id="imagePrice"
                min="0"
                step="0.01"
                placeholder="0.00"
              >
            </div>

            <div class="form-group">
              <label for="imageDescription">Description *</label>
              <textarea
                id="imageDescription"
                rows="5"
                placeholder="Describe your image..."
                required
              ></textarea>
            </div>

            <p id="formMessage" class="form-message"></p>

            <button type="submit" class="primary-button">
              ↑ Upload to repository
            </button>

          </div>

        </div>

      </form>

    </section>

    <!-- Repository gallery -->
    <section class="repository-section">

      <div class="section-heading">
        <span class="eyebrow">REPOSITORY / 02</span>
        <h2>Your images</h2>
        <p>Browse the images in your repository.</p>
      </div>

      <div class="repository-toolbar">
        <input
          type="search"
          id="searchImages"
          placeholder="Search images..."
        >

        <select id="filterCategory">
          <option value="All">All categories</option>
          <option value="Nature">Nature</option>
          <option value="People">People</option>
          <option value="Animals">Animals</option>
          <option value="Architecture">Architecture</option>
          <option value="Illustration">Illustration</option>
          <option value="Digital Art">Digital Art</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div id="imageGallery" class="image-gallery">
        <div class="empty-state">
          <div class="empty-icon">✦</div>
          <h3>No images yet</h3>
          <p>Upload your first image to begin.</p>
        </div>
      </div>

    </section>

  </main>

  <footer>
    IMAGE REPOSITORY · UPLOAD AND ORGANIZE
  </footer>

  <script src="script.js"></script>
</body>
</html>
